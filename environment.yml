name: data_gov_agent
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.14.6
  - pip>=24.0

  # Core data stack (conda-forge)
  - pandas=2.3.3
  - numpy=2.5.1
  - pyyaml=6.0.3
  - openpyxl=3.1.5

  # Remaining packages via pip (Snowflake connector, Ollama, etc.)
  - pip:
      - snowflake-connector-python[pandas]==4.7.1
      - pyarrow==23.0.1
      - python-dotenv==1.2.2
      - ollama==0.6.2
      - httpx==0.28.1
      - pydantic==2.13.4
      - tenacity==9.1.4
      - tqdm==4.70.0
      - cryptography==50.0.0
      - requests==2.34.2
