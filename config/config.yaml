# Tables to exclude from scanning (system/internal tables)
exclude_tables:
  - INFORMATION_SCHEMA
  - ACCOUNT_USAGE

# Optional: override primary key detection per table
# table_primary_keys:
#   CLIENTS:
#     - CLIENT_ID

# Generic profiling thresholds
profiling:
  null_rate_threshold: 0.05        # Flag columns with >5% nulls
  duplicate_pk_threshold: 0        # Any duplicate PK is flagged
  stale_days_threshold: 90         # Flag if max(updated_at) older than N days
  sample_size_for_llm: 5           # Sample rows sent to LLM per issue type

# Pipeline output
output:
  directory: output
  filename_prefix: dq_governance_report

# LLM settings (Llama 3.2 via Ollama)
llm:
  temperature: 0.1
  max_tokens: 1024

# Which rule categories to run
rules:
  run_generic_profiling: true
  run_business_rules: true
